version: "3.8"

services:
  nadimtrans-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nadimtrans-web
    restart: unless-stopped
    ports:
      # Terikat hanya pada localhost (127.0.0.1) agar port 3000 tidak terbuka langsung ke internet publik.
      # Semua traffic publik harus melewati Reverse Proxy Nginx pada host.
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

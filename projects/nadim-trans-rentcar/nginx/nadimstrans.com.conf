# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR NADIMSTRANS.COM
# Target: Production VPS Ubuntu/Debian with Certbot (Let's Encrypt)
# Location: /etc/nginx/sites-available/nadimstrans.com.conf
# ==============================================================================

# Upstream ke container Next.js yang berjalan di port 3000 (localhost)
upstream nadimtrans_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server - Redirect All Traffic to HTTPS & Allow ACME Challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nadimstrans.com www.nadimstrans.com;

    # Certbot ACME Webroot challenge untuk penerbitan/pembaruan sertifikat SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect permanen HTTP ke HTTPS (301)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server - Reverse Proxy ke Next.js dengan Optimasi Penuh
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nadimstrans.com www.nadimstrans.com;

    # --- SSL Certificates (Let's Encrypt / Certbot) ---
    ssl_certificate /etc/letsencrypt/live/nadimstrans.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nadimstrans.com/privkey.pem;

    # --- Modern TLS & Cipher Suite Configuration ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # --- SSL Session Caching & Optimization ---
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # --- OCSP Stapling (Meningkatkan performa handshake SSL) ---
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/nadimstrans.com/chain.pem;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --- Security Headers (A+ Rating di SSL Labs & SecurityHeaders) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Batas ukuran payload request (untuk upload formulir/gambar)
    client_max_body_size 20M;

    # --- Static Cache: Next.js Chunks & Static Files ---
    # File di /_next/static/ memiliki hash unik sehingga aman di-cache 1 tahun
    location /_next/static/ {
        proxy_pass http://nadimtrans_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --- Static Cache: Public Images & Icons ---
    location ~* \.(webp|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://nadimtrans_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # --- Main Application Reverse Proxy ---
    location / {
        proxy_pass http://nadimtrans_backend;
        proxy_http_version 1.1;

        # Header WebSocket & Keepalive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Header Identitas Client & Host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

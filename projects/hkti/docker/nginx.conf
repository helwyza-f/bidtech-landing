# Serves the Next.js static export (output: "export", trailingSlash: true)
# from inside the container. Listens on 3020 — the host's nginx reverse-proxies
# to this port (see deploy/nginx-reverse-proxy.conf.example).
server {
    listen 3020;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # manifest.webmanifest isn't in nginx's default mime.types
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Content-hashed build assets — safe to cache forever
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # trailingSlash: true means every route is a directory with its own
    # index.html (e.g. /galeri/index.html) — $uri/ covers both "/galeri" and
    # "/galeri/" without needing an explicit redirect.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

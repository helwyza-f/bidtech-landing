name: Frontend CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bidtech-frontend-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build template demos into frontend/public/demo
        run: ./scripts/build-template-demos.sh --copy

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

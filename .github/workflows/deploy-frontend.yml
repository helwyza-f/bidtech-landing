name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bidtech-frontend-production
  cancel-in-progress: false

jobs:
  # build-and-test-demos:
  #   name: 1. Build & Test Template Demos (404 Assets Check)
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4

  #     - name: Set up Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: "20"
  #         cache: npm
  #         cache-dependency-path: frontend/package-lock.json

  #     - name: Build template demos into frontend/public/demo
  #       run: ./scripts/build-template-demos.sh --copy

  build-frontend:
    name: Code Testing
    # needs: build-and-test-demos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build template demos into frontend/public/demo
        working-directory: frontend
        run: npm run demos:build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Next.js Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: 3. Deploy and Up Production
    needs: build-frontend
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Remote SSH Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST}}
          username: ${{ secrets.SSH_USER}}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "1.) Akses folder bidtech di VPS"
            cd /opt/bidtech-new
            git pull origin main || git pull

            echo "2.) Akses folder frontend bidtech"
            cd /opt/bidtech-new/frontend

            echo "3.) Build semua website template"
            npm run demos:build

            echo "4.) Build website bidtech"
            TAG=$(date +%Y%m%d%H%M)
            IMAGE_NAME="bidtech-frontend:$TAG"
            docker build -t "$IMAGE_NAME" .

            echo "==> Docker Images:"
            docker images | grep bidtech-frontend || true

            echo "==> 4. Stopping & removing existing container"
            docker stop BidTech-Frontend 2>/dev/null || true
            docker rm BidTech-Frontend 2>/dev/null || true

            echo "==> 5. Running new container"
            docker run -d \
              --name BidTech-Frontend \
              --restart unless-stopped \
              --network bidtech-api \
              --env-file /root/bidtech-frontend.env \
              -p 127.0.0.1:3010:3000 \
              "$IMAGE_NAME"

            echo "==> 6. Checking container status & logs"
            docker ps | grep BidTech-Frontend || true
            docker logs --tail 100 BidTech-Frontend

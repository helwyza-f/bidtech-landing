name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bidtech-frontend-production
  cancel-in-progress: false

jobs:
  build-and-test-demos:
    name: 1. Build & Test Template Demos (404 Assets Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build template demos into frontend/public/demo
        run: ./scripts/build-template-demos.sh --copy

      - name: Audit Demo Integrity & Check 404 Media Assets
        run: node scripts/test-demos.js

  build-frontend:
    name: 2. Build Main Next.js Frontend
    needs: build-and-test-demos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build template demos into frontend/public/demo
        run: ./scripts/build-template-demos.sh --copy

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Next.js Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: 3. Auto-Deploy to VPS Server
    needs: build-frontend
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Remote SSH Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '212.85.26.8' }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "==> 1. Updating repository in /opt/bidtech-new"
            cd /opt/bidtech-new
            git pull origin main || git pull

            echo "==> 2. Moving to frontend directory"
            cd /opt/bidtech-new/frontend

            TAG=$(date +%Y%m%d%H%M)
            IMAGE_NAME="bidtech-frontend:$TAG"

            echo "==> 3. Building Docker image: $IMAGE_NAME"
            docker build -t "$IMAGE_NAME" .

            echo "==> Docker Images:"
            docker images | grep bidtech-frontend || true

            echo "==> 4. Stopping & removing existing container"
            docker stop BidTech-Frontend 2>/dev/null || true
            docker rm BidTech-Frontend 2>/dev/null || true

            echo "==> 5. Running new container"
            docker run -d \
              --name BidTech-Frontend \
              --restart unless-stopped \
              --network bidtech-api \
              --env-file /root/bidtech-frontend.env \
              -p 127.0.0.1:3010:3000 \
              "$IMAGE_NAME"

            echo "==> 6. Checking container status & logs"
            docker ps | grep BidTech-Frontend || true
            docker logs --tail 100 BidTech-Frontend

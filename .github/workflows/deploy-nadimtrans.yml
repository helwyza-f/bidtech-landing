name: Nadim Trans CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "projects/nadim-trans-rentcar/**"
      - ".github/workflows/deploy-nadimtrans.yml"
  pull_request:
    branches:
      - main
    paths:
      - "projects/nadim-trans-rentcar/**"
      - ".github/workflows/deploy-nadimtrans.yml"
  workflow_dispatch:

# Gunakan concurrency group VPS bersama agar tidak tabrakan dengan workflow
# Bidtech saat keduanya melakukan git reset / Docker build di /opt/bidtech-new.
concurrency:
  group: vps-shared-repository
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # CI — build check (berjalan untuk push & pull_request ke main)
  # ---------------------------------------------------------------------------
  build:
    name: Build & Test Nadim Trans
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/nadim-trans-rentcar
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/nadim-trans-rentcar/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

  # ---------------------------------------------------------------------------
  # CD — deploy ke VPS (hanya push main atau workflow_dispatch manual)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          timeout: 2m
          command_timeout: 30m

          script: |
            set -euo pipefail

            # Tangkap kegagalan: tampilkan status & log sebelum exit
            cleanup() {
              local exit_code=$?
              if [ $exit_code -ne 0 ]; then
                echo ""
                echo "======================================================"
                echo "  DEPLOY GAGAL — container status & log"
                echo "======================================================"
                cd /opt/bidtech-new/projects/nadim-trans-rentcar 2>/dev/null || true
                docker compose ps || true
                docker compose logs --tail 100 nadimtrans-web || true
              fi
            }
            trap cleanup EXIT

            # 1. Update checkout bersama
            echo "==> [1/3] Update /opt/bidtech-new ke origin/main"
            cd /opt/bidtech-new
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # 2. Rebuild service nadimtrans-web
            echo "==> [2/3] Rebuild Docker Compose service nadimtrans-web"
            cd /opt/bidtech-new/projects/nadim-trans-rentcar
            docker compose up -d --build --wait --remove-orphans

            # 3. Health check port 3040
            echo "==> [3/3] Health check http://127.0.0.1:3040/"
            max_attempts=15
            attempt=0
            until curl -sf http://127.0.0.1:3040/ > /dev/null; do
              attempt=$((attempt + 1))
              if [ $attempt -ge $max_attempts ]; then
                echo "GAGAL: endpoint tidak merespons setelah $max_attempts percobaan"
                exit 1
              fi
              echo "  ... menunggu ($attempt/$max_attempts)"
              sleep 4
            done
            echo "Health check OK — nadimtrans-web merespons di port 3040"

            # Status akhir
            echo ""
            echo "==> Status container"
            docker compose ps

            echo ""
            echo "==> Log 100 baris terakhir nadimtrans-web"
            docker compose logs --tail 100 nadimtrans-web

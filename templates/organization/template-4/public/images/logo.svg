<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5132" />
      <stop offset="100%" stop-color="#063520" />
    </linearGradient>
    <linearGradient id="lightGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Border Ring -->
  <circle cx="256" cy="256" r="236" stroke="url(#greenGrad)" stroke-width="12" />
  <circle cx="256" cy="256" r="222" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- 16 Golden Accent Ticks -->
  <g fill="url(#goldGrad)">
    <circle cx="256" cy="26" r="5" />
    <circle cx="344" cy="43" r="5" />
    <circle cx="419" cy="93" r="5" />
    <circle cx="469" cy="168" r="5" />
    <circle cx="486" cy="256" r="5" />
    <circle cx="469" cy="344" r="5" />
    <circle cx="419" cy="419" r="5" />
    <circle cx="344" cy="469" r="5" />
    <circle cx="256" cy="486" r="5" />
    <circle cx="168" cy="469" r="5" />
    <circle cx="93" cy="419" r="5" />
    <circle cx="43" cy="344" r="5" />
    <circle cx="26" cy="256" r="5" />
    <circle cx="43" cy="168" r="5" />
    <circle cx="93" cy="93" r="5" />
    <circle cx="168" cy="43" r="5" />
  </g>

  <!-- Central Disc -->
  <circle cx="256" cy="256" r="202" fill="url(#greenGrad)" filter="url(#subtleGlow)" />
  <circle cx="256" cy="256" r="194" stroke="#146C43" stroke-width="3" />

  <!-- Dynamic Orbitals / Unity Rings -->
  <ellipse cx="256" cy="256" rx="160" ry="92" stroke="url(#goldGrad)" stroke-width="8" />
  <ellipse cx="256" cy="256" rx="160" ry="92" stroke="url(#lightGreenGrad)" stroke-width="8" transform="rotate(60 256 256)" />
  <ellipse cx="256" cy="256" rx="160" ry="92" stroke="#FFFFFF" stroke-width="7" stroke-opacity="0.9" transform="rotate(120 256 256)" />

  <!-- Central 8-Point Star of Leadership & Integrity -->
  <g filter="url(#subtleGlow)">
    <polygon points="256,170 268,230 328,218 280,256 328,294 268,282 256,342 244,282 184,294 232,256 184,218 244,230" fill="url(#goldGrad)" />
  </g>

  <!-- Inner Core Center -->
  <circle cx="256" cy="256" r="28" fill="url(#greenGrad)" stroke="#FFFFFF" stroke-width="4" />
  <circle cx="256" cy="256" r="15" fill="url(#goldGrad)" />
</svg>

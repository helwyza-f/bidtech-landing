<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-label="Pelatihan Wirausaha &amp; Vokasi Mandiri">
  <defs>
    <linearGradient id="bgSocial2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#053f5c"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" rx="16" fill="url(#bgSocial2)"/>

  <!-- Workshop & Vocational Training Board -->
  <g transform="translate(70, 45)">
    <rect width="500" height="270" rx="16" fill="#ffffff" fill-opacity="0.96"/>

    <!-- Header Banner -->
    <rect x="25" y="20" width="450" height="42" rx="10" fill="#0f766e"/>
    <text x="45" y="46" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff">
      Kelas Keterampilan Mandiri &amp; Pendampingan Usaha
    </text>

    <!-- 3 Skill Modules -->
    <!-- Module 1: Olahan Pangan / Kuliner -->
    <g transform="translate(25, 80)">
      <rect width="135" height="155" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="15" y="15" width="105" height="55" rx="8" fill="#fef3c7"/>
      <circle cx="67" cy="42" r="18" fill="#f59e0b"/>
      <!-- Chef Hat Icon -->
      <path d="M58 45 C55 35 79 35 76 45 Z" fill="#ffffff"/>
      <rect x="58" y="45" width="18" height="4" fill="#ffffff"/>
      <text x="18" y="92" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Tata Boga Rumahan</text>
      <text x="18" y="110" font-family="sans-serif" font-size="9" fill="#64748b">Olahan kue, frozen food, &amp; kemasan higienis</text>
      <rect x="18" y="128" width="99" height="16" rx="4" fill="#dcfce7"/>
      <text x="25" y="140" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#15803d">Siap Jual di Pasar</text>
    </g>

    <!-- Module 2: Kerajinan & Menjahit -->
    <g transform="translate(182, 80)">
      <rect width="135" height="155" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="15" y="15" width="105" height="55" rx="8" fill="#e0f2fe"/>
      <circle cx="67" cy="42" r="18" fill="#0284c7"/>
      <!-- Craft / Sewing Needle Icon -->
      <path d="M57 48 L77 36" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="77" cy="36" r="3" fill="#ffffff"/>
      <text x="18" y="92" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Jahit &amp; Kerajinan</text>
      <text x="18" y="110" font-family="sans-serif" font-size="9" fill="#64748b">Pola busana, tas anyaman, &amp; suvenir daerah</text>
      <rect x="18" y="128" width="99" height="16" rx="4" fill="#dcfce7"/>
      <text x="25" y="140" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#15803d">Sertifikat Vokasi</text>
    </g>

    <!-- Module 3: Hidroponik & Kebun Warga -->
    <g transform="translate(340, 80)">
      <rect width="135" height="155" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="15" y="15" width="105" height="55" rx="8" fill="#dcfce7"/>
      <circle cx="67" cy="42" r="18" fill="#10b981"/>
      <!-- Leaf Sprout Icon -->
      <path d="M67 52 v-15 M67 44 c6-8 12-4 12 0 c-6 4-12 0-12 0 M67 44 c-6-8-12-4-12 0 c6 4 12 0 12 0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="18" y="92" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Hidroponik Mandiri</text>
      <text x="18" y="110" font-family="sans-serif" font-size="9" fill="#64748b">Sayuran organik, ketahanan pangan keluarga</text>
      <rect x="18" y="128" width="99" height="16" rx="4" fill="#dcfce7"/>
      <text x="25" y="140" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#15803d">Bibit &amp; Alat Gratis</text>
    </g>
  </g>
</svg>

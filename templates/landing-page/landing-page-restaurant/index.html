    <!--
      PENTING: tag di bawah ini adalah versi STATIS.

      membaca yang ada di file ini. Jadi nilai default di sini harus tetap benar.

    <title>Chef's Table — Restoran Bahan Segar di Pagedangan, Tangerang</title>

      name="description"

    <link rel="canonical" href="https://chefstable.example.com" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chef's Table" />
    <meta property="og:locale" content="id_ID" />

      property="og:title"
      content="Chef's Table — Restoran Bahan Segar di Pagedangan, Tangerang"

      property="og:description"
      content="Pengalaman kuliner dengan bahan musiman dan teknik halus. Burger, taco, wrap, dan minuman segar racikan koki."
    />
    <meta property="og:url" content="https://chefstable.example.com" />
    <meta property="og:image" content="https://chefstable.example.com/og-image.jpg" />

      name="twitter:description"
      content="Pengalaman kuliner dengan bahan musiman dan teknik halus."
    />

  </head>
